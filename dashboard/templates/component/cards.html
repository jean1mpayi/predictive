<section
  class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4 text-slate-900"
>
  <!-- HEALTH CARD -->
  <div
    id="healthCard"
    class="rounded-2xl border border-slate-100 bg-white p-5 flex flex-col justify-between h-full shadow-sm hover:shadow-md transition-shadow"
  >
    <div class="flex items-start justify-between mb-2">
      <div class="p-2 rounded-xl bg-slate-50 text-cyan-400">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"
          />
        </svg>
      </div>
      <div
        id="healthTrend"
        class="flex items-center gap-1 px-2 py-1 rounded-full bg-slate-50 text-xs font-medium text-cyan-400"
      >
        ➜
      </div>
    </div>
    <div>
      <p
        class="text-slate-500 text-[0.65rem] uppercase tracking-wider font-bold mb-1"
      >
        Santé
      </p>
      <div class="flex items-baseline gap-1 mt-1">
        <h2 id="healthValue" class="text-2xl font-black text-slate-900">
          0.00
        </h2>
        <span class="text-slate-500 text-xs font-medium">%</span>
      </div>
    </div>
  </div>

  <!-- TEMPERATURE CARD -->
  <div
    id="temperatureCard"
    class="rounded-2xl border border-slate-100 bg-white p-5 flex flex-col justify-between h-full shadow-sm hover:shadow-md transition-shadow"
  >
    <div class="flex items-start justify-between mb-2">
      <div class="p-2 rounded-xl bg-slate-50 text-amber-400">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z" />
        </svg>
      </div>
      <div
        id="temperatureTrend"
        class="flex items-center gap-1 px-2 py-1 rounded-full bg-slate-50 text-xs font-medium text-amber-400"
      >
        ➜
      </div>
    </div>
    <div>
      <p
        class="text-slate-500 text-[0.65rem] uppercase tracking-wider font-bold mb-1"
      >
        Température
      </p>
      <div class="flex items-baseline gap-1 mt-1">
        <h2 id="temperatureValue" class="text-2xl font-black text-slate-900">
          0.00
        </h2>
        <span class="text-slate-500 text-xs font-medium">°C</span>
      </div>
    </div>
  </div>

  <!-- CURRENT CARD -->
  <div
    id="currentCard"
    class="rounded-2xl border border-slate-100 bg-white p-5 flex flex-col justify-between h-full shadow-sm hover:shadow-md transition-shadow"
  >
    <div class="flex items-start justify-between mb-2">
      <div class="p-2 rounded-xl bg-slate-50 text-green-400">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
        </svg>
      </div>
      <div
        id="currentTrend"
        class="flex items-center gap-1 px-2 py-1 rounded-full bg-slate-50 text-xs font-medium text-green-400"
      >
        ➜
      </div>
    </div>
    <div>
      <p
        class="text-slate-500 text-[0.65rem] uppercase tracking-wider font-bold mb-1"
      >
        Courant
      </p>
      <div class="flex items-baseline gap-1 mt-1">
        <h2 id="currentValue" class="text-2xl font-black text-slate-900">
          0.00
        </h2>
        <span class="text-slate-500 text-xs font-medium">A</span>
      </div>
    </div>
  </div>

  <!-- SPEED CARD -->
  <div
    id="speedCard"
    class="rounded-2xl border border-slate-100 bg-white p-5 flex flex-col justify-between h-full shadow-sm hover:shadow-md transition-shadow"

    <div class="flex items-start justify-between mb-2">
      <div class="p-2 rounded-xl bg-slate-50 text-blue-400">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m12 14 4-4" />
          <path d="M3.34 19a10 10 0 1 1 17.32 0" />
        </svg>
      </div>
      <div
        id="speedTrend"
        class="flex items-center gap-1 px-2 py-1 rounded-full bg-slate-50 text-xs font-medium text-blue-400"
      >
        ➜
      </div>
    </div>
    <div>
      <p
        class="text-slate-500 text-[0.65rem] uppercase tracking-wider font-bold mb-1"
      >
        Vitesse
      </p>
      <div class="flex items-baseline gap-1 mt-1">
        <h2 id="speedValue" class="text-2xl font-black text-slate-900">0.00</h2>
        <span class="text-slate-500 text-xs font-medium">rpm</span>
      </div>
    </div>
  </div>

  <!-- VIBRATION CARD -->
  <div

    class="rounded-2xl border border-slate-100 bg-white p-5 flex flex-col justify-between h-full shadow-sm hover:shadow-md transition-shadow"

      <div class="p-2 rounded-xl bg-slate-50 text-rose-400">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
        </svg>
      </div>
      <div
        id="vibrationTrend"
        class="flex items-center gap-1 px-2 py-1 rounded-full bg-slate-50 text-xs font-medium text-rose-400"
      >
        ➜
      </div>
    </div>
    <div>
      <p
        class="text-slate-500 text-[0.65rem] uppercase tracking-wider font-bold mb-1"
      >
        Vibration
      </p>
      <div class="flex items-baseline gap-1 mt-1">
        <h2 id="vibrationValue" class="text-2xl font-black text-slate-900">
          0.00
        </h2>
        <span class="text-slate-500 text-xs font-medium">g</span>
      </div>
    </div>
  </div>

  <!-- TORQUE CARD -->
  <div
    id="torqueCard"
    class="rounded-2xl border border-slate-100 bg-white p-5 flex flex-col justify-between h-full shadow-sm hover:shadow-md transition-shadow"
  >
    <div class="flex items-start justify-between mb-2">
      <div class="p-2 rounded-xl bg-slate-50 text-purple-400">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"
          />

      <div

        class="flex items-center gap-1 px-2 py-1 rounded-full bg-slate-50 text-xs font-medium text-purple-400"
      >
        ➜
      </div>
    </div>
    <div>
      <p
        class="text-slate-500 text-[0.65rem] uppercase tracking-wider font-bold mb-1"
      >
        Couple
      </p>
      <div class="flex items-baseline gap-1 mt-1">
        <h2 id="torqueValue" class="text-2xl font-black text-slate-900">
          0.00
        </h2>
        <span class="text-slate-500 text-xs font-medium">N.m</span>
      </div>
    </div>
  </div>
</section>

<aside
  class="w-full lg:w-[19rem] shrink-0 p-6 border-r border-slate-200 bg-slate-50 shadow-md"
>
  <div
    class="flex items-center gap-[0.9rem] pb-4 border-b border-slate-200 mb-4"
  >
    <div
      class="w-12 h-12 rounded-[0.9rem] grid place-items-center bg-cyan-100 border border-cyan-300 text-cyan-800 font-extrabold tracking-[0.08em]"
    >
      BI
    </div>
    <div>
      <h1 class="text-[1.05rem] font-extrabold text-slate-900 m-0">
        Bouchonnage IA
      </h1>
      <p class="text-slate-500 mt-1 text-[0.82rem]">
        Maintenance prédictive industrielle
      </p>
    </div>
  </div>

  <div class="mt-5">
    <span
      class="block text-[0.72rem] uppercase tracking-[0.16em] mb-3 text-slate-500 font-semibold"
      >Navigation</span
    >
    <nav class="grid gap-2">
      <a
        class="px-[0.95rem] py-[0.8rem] rounded-[0.9rem] text-slate-700 font-medium border border-transparent bg-white hover:border-cyan-200 hover:bg-cyan-50 transition-all duration-200 ease-in shadow-sm"
        href="{% url 'dashboard' %}"
        >Vue SCADA</a
      >
      <a
        class="px-[0.95rem] py-[0.8rem] rounded-[0.9rem] text-slate-700 font-medium border border-transparent bg-white hover:border-cyan-200 hover:bg-cyan-50 transition-all duration-200 ease-in shadow-sm"
        href="#"
        >Simulation</a
      >
      <a
        class="px-[0.95rem] py-[0.8rem] rounded-[0.9rem] text-slate-700 font-medium border border-transparent bg-white hover:border-cyan-200 hover:bg-cyan-50 transition-all duration-200 ease-in shadow-sm"
        href="#"
        >Machine</a
      >
      <a
        class="px-[0.95rem] py-[0.8rem] rounded-[0.9rem] text-slate-700 font-medium border border-transparent bg-white hover:border-cyan-200 hover:bg-cyan-50 transition-all duration-200 ease-in shadow-sm"
        href="{% url 'alerts_list' %}"
        >Alertes</a
      >
      <a
        class="px-[0.95rem] py-[0.8rem] rounded-[0.9rem] text-slate-700 font-medium border border-transparent bg-white hover:border-cyan-200 hover:bg-cyan-50 transition-all duration-200 ease-in shadow-sm"
        href="#"
        >Paramètres</a
      >
    </nav>
  </div>

  <div class="mt-5">
    <span
      class="block text-[0.72rem] uppercase tracking-[0.16em] mb-3 text-slate-500 font-semibold"
      >Injection de Défauts</span
    >
    <div class="grid gap-3">
      <select
        id="faultSelector"
        class="w-full px-[0.95rem] py-[0.7rem] rounded-[0.9rem] bg-white border border-slate-200 text-slate-800 shadow-sm focus:outline-none focus:border-cyan-400"
      >
        <option value="NORMAL">Normal</option>
        <option value="BEARING_WEAR">Usure Roulement</option>
        <option value="COOLING_FAILURE">Défaillance Refroidissement</option>
        <option value="MOTOR_OVERLOAD">Surcharge Moteur</option>
        <option value="ROTOR_MISALIGNMENT">Désalignement Rotor</option>
        <option value="ELECTRICAL_FAULT">Défaut Électrique</option>
        <option value="POWER_LOSS">Perte de Puissance</option>
      </select>

      <button
        id="faultApplyBtn"
        class="px-[0.95rem] py-[0.78rem] rounded-[0.9rem] bg-cyan-100 border border-cyan-300 text-cyan-800 font-bold tracking-[0.03em] shadow-sm transition-all duration-200 hover:bg-cyan-200"
      >
        Appliquer le défaut
      </button>

      <div
        class="flex items-center justify-start gap-3 text-slate-600 font-medium"
      >
        <span
          class="w-[0.9rem] h-[0.9rem] rounded-full bg-orange-500 shadow-[0_0_12px_rgba(249,115,22,0.4)] shrink-0"
          id="faultLed"
        ></span>
        <span id="faultStatus">Défaut: NORMAL</span>
      </div>
    </div>
  </div>

  <div class="mt-5">
    <span
      class="block text-[0.72rem] uppercase tracking-[0.16em] mb-3 text-slate-500 font-semibold"
      >Réglage manuel</span
    >
    <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <div class="mb-4 flex items-center justify-between gap-3">
        <div>
          <p class="text-xs uppercase tracking-[0.18em] text-slate-500">
            Paramètres moteur
          </p>
          <h4 class="mt-1 text-sm font-semibold text-slate-900">
            Contrôle manuel
          </h4>
        </div>
        <span
          id="manualBadge"
          class="rounded-full border border-cyan-200 bg-cyan-50 px-3 py-1 text-[11px] font-semibold uppercase tracking-[0.18em] text-cyan-700"
        >
          Backend connecté
        </span>
      </div>

      <div class="space-y-4" id="manualSliders">
        <label class="block">
          <div
            class="mb-2 flex items-center justify-between text-xs uppercase tracking-[0.16em] text-slate-500 font-medium"
          >
            <span>Température</span>
            <span id="manualVal-temperature" class="font-bold text-slate-800"
              >40 °C</span
            >
          </div>
          <input
            id="manualSlider-temperature"
            data-param="temperature"
            data-unit="°C"
            type="range"
            min="0"
            max="130"
            step="0.5"
            value="40"
            class="h-2 w-full cursor-pointer appearance-none rounded-full bg-slate-200 accent-cyan-500"
          />
        </label>

        <label class="block">
          <div
            class="mb-2 flex items-center justify-between text-xs uppercase tracking-[0.16em] text-slate-500 font-medium"
          >
            <span>Vibration</span>
            <span id="manualVal-vibration" class="font-bold text-slate-800"
              >0.25 g</span
            >
          </div>
          <input
            id="manualSlider-vibration"
            data-param="vibration"
            data-unit="g"
            type="range"
            min="0"
            max="5"
            step="0.01"
            value="0.25"
            class="h-2 w-full cursor-pointer appearance-none rounded-full bg-slate-200 accent-amber-500"
          />
        </label>

        <label class="block">
          <div
            class="mb-2 flex items-center justify-between text-xs uppercase tracking-[0.16em] text-slate-500 font-medium"
          >
            <span>Courant</span>
            <span id="manualVal-current" class="font-bold text-slate-800"
              >7.0 A</span
            >
          </div>
          <input
            id="manualSlider-current"
            data-param="current"
            data-unit="A"
            type="range"
            min="0"
            max="30"
            step="0.1"
            value="7"
            class="h-2 w-full cursor-pointer appearance-none rounded-full bg-slate-200 accent-emerald-500"
          />
        </label>

        <label class="block">
          <div
            class="mb-2 flex items-center justify-between text-xs uppercase tracking-[0.16em] text-slate-500 font-medium"
          >
            <span>Charge</span>
            <span id="manualVal-load" class="font-bold text-slate-800"
              >40 %</span
            >
          </div>
          <input
            id="manualSlider-load"
            data-param="load"
            data-unit="%"
            type="range"
            min="0"
            max="100"
            step="1"
            value="40"
            class="h-2 w-full cursor-pointer appearance-none rounded-full bg-slate-200 accent-fuchsia-500"
          />
        </label>

        <label class="block">
          <div
            class="mb-2 flex items-center justify-between text-xs uppercase tracking-[0.16em] text-slate-500 font-medium"
          >
            <span>Usure roulements</span>
            <span id="manualVal-wear" class="font-bold text-slate-800"
              >5 %</span
            >
          </div>
          <input
            id="manualSlider-wear"
            data-param="wear"
            data-unit="%"
            type="range"
            min="0"
            max="100"
            step="0.5"
            value="5"
            class="h-2 w-full cursor-pointer appearance-none rounded-full bg-slate-200 accent-rose-500"
          />
        </label>

        <label class="block">
          <div
            class="mb-2 flex items-center justify-between text-xs uppercase tracking-[0.16em] text-slate-500 font-medium"
          >
            <span>Désalignement</span>
            <span id="manualVal-misalignment" class="font-bold text-slate-800"
              >0 %</span
            >
          </div>
          <input
            id="manualSlider-misalignment"
            data-param="misalignment"
            data-unit="%"
            type="range"
            min="0"
            max="100"
            step="1"
            value="0"
            class="h-2 w-full cursor-pointer appearance-none rounded-full bg-slate-200 accent-orange-500"
          />
        </label>

        <label class="block">
          <div
            class="mb-2 flex items-center justify-between text-xs uppercase tracking-[0.16em] text-slate-500 font-medium"
          >
            <span>Refroidissement</span>
            <span
              id="manualVal-cooling_efficiency"
              class="font-bold text-slate-800"
              >100 %</span
            >
          </div>
          <input
            id="manualSlider-cooling_efficiency"
            data-param="cooling_efficiency"
            data-unit="%"
            type="range"
            min="0"
            max="100"
            step="1"
            value="100"
            class="h-2 w-full cursor-pointer appearance-none rounded-full bg-slate-200 accent-sky-500"
          />
        </label>
      </div>

      <button
        id="manualResetAllBtn"
        class="mt-4 w-full py-[0.65rem] rounded-xl border border-slate-200 bg-slate-50 text-[0.75rem] uppercase tracking-[0.12em] text-slate-600 font-bold hover:border-rose-200 hover:bg-rose-50 hover:text-rose-600 transition-all duration-200"
      >
        ↺ Réinitialiser tout
      </button>
    </div>
  </div>

  <div class="mt-6 pt-4 border-t border-slate-200 grid gap-[0.8rem]">
    <span
      class="block text-[0.72rem] uppercase tracking-[0.16em] mb-1 text-slate-500 font-semibold"
      >Connectivité</span
    >
    <div
      class="flex items-center justify-between gap-3 text-slate-600 font-medium"
    >
      <span
        class="w-[0.9rem] h-[0.9rem] rounded-full bg-green-500 shadow-[0_0_12px_rgba(34,197,94,0.4)] shrink-0"
      ></span>
      <span>API backend actif</span>
    </div>
    <div
      class="flex items-center justify-between gap-3 text-slate-600 font-medium"
    >
      <span
        class="w-[0.9rem] h-[0.9rem] rounded-full bg-cyan-500 shadow-[0_0_12px_rgba(6,182,212,0.4)] shrink-0"
      ></span>
      <span>Tableau de bord Tailwind</span>
    </div>
  </div>
</aside>

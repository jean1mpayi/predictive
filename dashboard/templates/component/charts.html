<section
  class="rounded-[1.5rem] bg-slate-900 border border-slate-800 shadow-2xl p-6 text-white"
>
  <!-- En-tête -->
  <div
    class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6"
  >
    <div>
      <div class="flex items-center gap-2">
        <span
          class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"
        ></span>
        <p class="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">
          Télémétrie en direct
        </p>
      </div>
      <h3 class="mt-1 text-xl font-extrabold tracking-tight text-white">
        Supervision industrielle
      </h3>
    </div>
    <div>
      <select
        id="chartSelector"
        class="px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm font-semibold text-white shadow-inner focus:outline-none focus:border-cyan-400 transition-all cursor-pointer"
      >
        <option value="temperature">Température</option>
        <option value="vibration">Vibration</option>
        <option value="current">Courant</option>
        <option value="speed">Vitesse</option>
        <option value="torque">Couple</option>
        <option value="health">Santé de la machine</option>
      </select>
    </div>
  </div>

  <!-- Zone du Graphique (Hauteur fixe propre) -->
  <div
    class="w-full h-[22rem] rounded-xl overflow-hidden shadow-inner border border-slate-800"
  >
    <canvas id="mainChart" class="w-full h-full block"></canvas>
  </div>

  <!-- Actions -->
  <div
    class="flex flex-wrap items-center gap-3 mt-6 pt-5 border-t border-slate-800"
  >
    <button
      id="btnStart"
      class="px-5 py-2.5 rounded-xl text-sm font-bold tracking-wide bg-gradient-to-r from-cyan-500 to-cyan-600 hover:from-cyan-400 hover:to-cyan-500 text-white active:scale-[0.98] transition-all shadow-lg shadow-cyan-500/20"
    >
      Démarrer simulation
    </button>
    <button
      id="btnStop"
      class="px-5 py-2.5 rounded-xl text-sm font-bold tracking-wide bg-rose-500/10 border border-rose-500/50 text-rose-300 hover:bg-rose-500 hover:text-white active:scale-[0.98] transition-all"
    >
      Arrêter
    </button>
  </div>
</section>
